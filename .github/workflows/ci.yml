# Runs the linter, the tests and a Docker build on GitHub's servers
# for every push to main and for every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          # Reuse downloaded packages between runs, so installs are faster.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # No OpenAI key needed: the tests replace the LLM with fakes.
      - name: Run tests
        run: pytest

  # Runs in parallel with "test": checks that the Docker image builds and the API starts.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t dental-bot .

      # A fake key is enough: /health does not call OpenAI.
      - name: Start the container and check /health
        run: |
          docker run -d --name bot -p 8000:8000 -e OPENAI_API_KEY=sk-not-used dental-bot
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs bot
          exit 1
